<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成绩与解析｜Agent Foundations Lab</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="site-head"><div class="wrap"><a class="brand" href="../"><b>AGENT</b> FOUNDATIONS LAB</a><nav class="nav"><a href="../">返回首页</a><a href="../learn/">返回教程</a><a href="../quiz/">重新作答</a></nav><a class="lang" href="../en/results/">EN</a></div></header><main><div class="report" id="report"></div></main><footer><div class="wrap"><b>AGENT FOUNDATIONS LAB</b> · 提交后提供答案与复习路径。</div></footer><script src="../assets/app.js"></script><script>const lang='zh',q=AGL.questions[lang],a=AGL.read(lang),r=document.querySelector('#report');if(!a.submittedAt){r.innerHTML='<h1>尚未提交试卷</h1><p>请先完成独立测验；提交后这里会显示成绩、逐题答案与解析。</p><a class="button" href="../quiz/">开始测试</a><a class="button alt" href="../learn/">返回教程</a>'}else{let total=a.totalScore??0,pass=total>=90;let h=`<div class="eyebrow" style="color:var(--blue)">SUBMITTED RESULT</div><div class="score-big">${total}<small style="font-size:25px"> / 100</small></div><h1>${pass?'已达到扎实掌握标准':'建议复习后重新作答'}</h1><p>自动评分：<b>${a.autoScore||0}/20</b>　自我评分：<b>${Object.values(a.selfScores).reduce((x,y)=>x+(+y||0),0)}/80</b></p><p class="callout ${pass?'':'warn'}">${pass?'你已能较完整地解释 Agent Runtime 的主链路。仍建议重点检查取消、权限和 Tool Result 的理解。':'90 分是本课程的学习门槛。请阅读逐题解析，并通过链接回到对应教程章节复习。'}</p><h2>逐题答案与解析</h2>`;q.objective.forEach((x,i)=>{let mine=a.answers['o'+i],ok=(mine==='true')===x[1];h+=`<article class="answer"><b>Q${i+1}. ${x[0]}</b><p class="${ok?'ok':'bad'}">${ok?'✓ 回答正确':'✕ 需要复习'} · 你的答案：${mine==='true'?'正确':mine==='false'?'错误':'未答'} · 正确答案：${x[1]?'正确':'错误'}</p><details ${ok?'':'open'}><summary>查看解释</summary><p>${x[2]}</p><a href="../learn/#${i===1?'tool-result':i===4?'cancellation':i===8?'security-boundary':'overview'}">回到教程复习 →</a></details></article>`});q.long.forEach((x,i)=>{let mine=a.answers['l'+i]||'（未作答）',score=a.selfScores['l'+i]??0;h+=`<article class="answer"><b>Q${i+11}. ${x[0]}</b><p>你的自评分：<b>${score} / ${x[1]}</b></p><details><summary>查看评分要点与答案说明</summary><p>${x[2]}</p><p><b>你的作答：</b><br>${mine.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</p><a href="../learn/#${i===6?'cancellation':i===7?'security-boundary':i===3?'tool-call':i===4?'tool-result':i===2?'session':'overview'}">回到教程复习 →</a></details></article>`});h+='<div class="lesson-end"><h2>下一步</h2><p>将错误题的解释与教程对应章节一起复习，再重新参加测试。</p><a class="button" href="../quiz/">重新作答</a><a class="button alt" href="../learn/">返回教程</a></div>';r.innerHTML=h}</script></body></html>
