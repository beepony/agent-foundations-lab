<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立测验｜Agent Foundations Lab</title><link rel="stylesheet" href="../assets/style.css"></head><body class="exam-body"><header class="exam-head"><div class="wrap"><b>AGENT FOUNDATIONS LAB · KNOWLEDGE CHECK</b><span><a href="../learn/">返回教程</a>　<a href="../en/quiz/">EN</a></span></div></header><main class="exam"><div class="exam-intro"><div class="eyebrow">100 POINTS · LOCAL ONLY</div><h1>Agent 底层机制测验</h1><p>本页只用于答题。答案会自动保存在当前浏览器；提交后才显示正确答案与逐题解析。</p></div><div class="quiz-shell"><b id="count">0 / 23</b> 题已完成<div class="progress"><i id="bar"></i></div><div id="questions"></div><div class="actions"><button id="submit">提交试卷</button><button class="alt" id="clear">清空本次答案</button><span class="status" id="saved"></span></div><p class="status">本测验用于学习自测；答案不会上传，不是职业认证。</p></div></main><script src="../assets/app.js"></script><script>const lang='zh',q=AGL.questions[lang],attempt=AGL.read(lang),box=document.querySelector('#questions');function render(){let h='';q.objective.forEach((x,i)=>h+=`<article class="q"><div class="points">Q${i+1} · 2 分 · 自动评分</div><h3>${x[0]}</h3><div class="options"><label class="option"><input type="radio" name="o${i}" value="true" ${attempt.answers['o'+i]==='true'?'checked':''}> 正确</label><label class="option"><input type="radio" name="o${i}" value="false" ${attempt.answers['o'+i]==='false'?'checked':''}> 错误</label></div></article>`);q.long.forEach((x,i)=>{let n=i+11;h+=`<article class="q"><div class="points">Q${n} · ${x[1]} 分 · 自我评分</div><h3>${x[0]}</h3><textarea data-a="l${i}" placeholder="写下你的答案…">${attempt.answers['l'+i]||''}</textarea><div class="rubric"><b>提交前请根据下面的评分要点自评：</b><br>${x[2]}<br><label>自评分（最高 ${x[1]}）： <input class="score" type="number" min="0" max="${x[1]}" data-s="l${i}" value="${attempt.selfScores['l'+i]??''}"> / ${x[1]}</label></div></article>`});box.innerHTML=h;box.querySelectorAll('input,textarea').forEach(e=>e.oninput=()=>{if(e.dataset.s)attempt.selfScores[e.dataset.s]=Math.min(+e.max,Math.max(0,+e.value||0));else if(e.dataset.a)attempt.answers[e.dataset.a]=e.value;else if(e.checked)attempt.answers[e.name]=e.value;AGL.write(lang,attempt);document.querySelector('#saved').textContent='已保存到本机';progress()});progress()}function progress(){let n=0;for(let i=0;i<10;i++)if(attempt.answers['o'+i])n++;for(let i=0;i<13;i++)if((attempt.answers['l'+i]||'').trim())n++;document.querySelector('#count').textContent=`${n} / 23`;document.querySelector('#bar').style.width=n/23*100+'%'}document.querySelector('#submit').onclick=()=>{let auto=0;q.objective.forEach((x,i)=>{if((attempt.answers['o'+i]==='true')===x[1])auto+=2});attempt.autoScore=auto;attempt.totalScore=auto+Object.values(attempt.selfScores).reduce((a,b)=>a+(+b||0),0);attempt.submittedAt=new Date().toISOString();AGL.write(lang,attempt);location.href='../results/'};document.querySelector('#clear').onclick=()=>{if(confirm('清空本次作答？')){localStorage.removeItem(AGL.key(lang));location.reload()}};render();</script></body></html>
