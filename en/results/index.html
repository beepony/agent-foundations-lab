<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results｜Agent Foundations Lab</title><link rel="stylesheet" href="../../assets/style.css"></head><body><header class="site-head"><div class="wrap"><a class="brand" href="../"><b>AGENT</b> FOUNDATIONS LAB</a><nav class="nav"><a href="../">Home</a><a href="../learn/">Guide</a><a href="../quiz/">Retake quiz</a></nav><a class="lang" href="../../results/">中文</a></div></header><main><div class="report" id="report"></div></main><footer><div class="wrap"><b>AGENT FOUNDATIONS LAB</b> · Answers and review appear after submission.</div></footer><script src="../../assets/app.js"></script><script>const lang='en',q=AGL.questions[lang],a=AGL.read(lang),r=document.querySelector('#report');if(!a.submittedAt){r.innerHTML='<h1>No submitted quiz yet</h1><p>Complete the focused quiz first. This page will then show your score and explanations.</p><a class="button" href="../quiz/">Start quiz</a><a class="button alt" href="../learn/">Back to guide</a>'}else{let total=a.totalScore??0,pass=total>=90;let h=`<div class="eyebrow" style="color:var(--blue)">SUBMITTED RESULT</div><div class="score-big">${total}<small style="font-size:25px"> / 100</small></div><h1>${pass?'Strong mastery threshold reached':'Review and retake recommended'}</h1><p>Automatic score: <b>${a.autoScore||0}/20</b>　Self score: <b>${Object.values(a.selfScores).reduce((x,y)=>x+(+y||0),0)}/80</b></p><p class="callout ${pass?'':'warn'}">${pass?'You can coherently explain the main Agent Runtime loop. Still review cancellation, permission boundaries, and Tool Results.':'90 is the learning threshold. Review the explanations and return to the linked lesson sections before retaking.'}</p><h2>Answers and explanations</h2>`;q.objective.forEach((x,i)=>{let mine=a.answers['o'+i],ok=(mine==='true')===x[1];h+=`<article class="answer"><b>Q${i+1}. ${x[0]}</b><p class="${ok?'ok':'bad'}">${ok?'✓ Correct':'✕ Review needed'} · Your answer: ${mine==='true'?'True':mine==='false'?'False':'Unanswered'} · Correct: ${x[1]?'True':'False'}</p><details ${ok?'':'open'}><summary>Read explanation</summary><p>${x[2]}</p><a href="../learn/#${i===1?'tool-result':i===4?'cancellation':i===8?'security-boundary':'overview'}">Review lesson →</a></details></article>`});q.long.forEach((x,i)=>{let mine=a.answers['l'+i]||'(Unanswered)',score=a.selfScores['l'+i]??0;h+=`<article class="answer"><b>Q${i+11}. ${x[0]}</b><p>Your self-score: <b>${score} / ${x[1]}</b></p><details><summary>Read rubric and answer guidance</summary><p>${x[2]}</p><p><b>Your answer:</b><br>${mine.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</p><a href="../learn/#${i===6?'cancellation':i===7?'security-boundary':i===3?'tool-call':i===4?'tool-result':i===2?'session':'overview'}">Review lesson →</a></details></article>`});h+='<div class="lesson-end"><h2>Next step</h2><p>Use explanations and lesson links to review weak points, then retake the quiz.</p><a class="button" href="../quiz/">Retake quiz</a><a class="button alt" href="../learn/">Back to guide</a></div>';r.innerHTML=h}</script></body></html>
